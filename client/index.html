<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrypticStorage</title>
    <meta name="description" content="Zero-knowledge encrypted file storage. Files are encrypted in your browser before upload; the server never sees your keys." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827" />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The Content-Security-Policy is sent as an HTTP header by nginx (see nginx.conf). -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        <h1 style="font-size: 2rem; margin-bottom: 1rem; color: #111827">JavaScript required</h1>
        <p style="font-size: 1.125rem; color: #6b7280; max-width: 600px">
          CrypticStorage encrypts and decrypts your files on your device, which needs JavaScript. Please enable it to continue.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
