# CrypticStorage – full stack: Postgres, API, nginx-served web app.
#
#   cp .env.example .env   # once; fill in the secrets (the stack refuses placeholders)
#   docker compose up -d --build
#   open http://localhost:${WEB_PORT:-3000}
#
# Encrypted objects live on the storage_data volume (the API's local driver) and
# stream through the API. To use an external S3-compatible store instead, set
# STORAGE_DRIVER=s3 plus S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY in .env;
# S3_PUBLIC_ENDPOINT additionally lets browsers use presigned URLs directly.
# (MinIO used to ship in this file; its images were removed from Docker Hub and
# Quay in September 2026, so it is no longer a dependency.)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypticstorage
      POSTGRES_USER: crypticstorage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crypticstorage -d crypticstorage']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://crypticstorage:${POSTGRES_PASSWORD}@postgres:5432/crypticstorage
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /app/data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-crypticstorage}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:-10737418240}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-5368709120}
    volumes:
      - storage_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
