# CrypticStorage – full stack.
#
#   cp .env.example .env   # then fill in the secrets (the file refuses to start with placeholders)
#   docker compose up -d --build
#   open http://localhost:${WEB_PORT:-3000}
#
# Uploads and downloads go through the API by default. To let browsers talk to
# MinIO directly with presigned URLs, set S3_PUBLIC_ENDPOINT=http://localhost:9000
# in .env (MinIO's CORS is configured from APP_URL below).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypticstorage
      POSTGRES_USER: crypticstorage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crypticstorage -d crypticstorage']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Needed only when S3_PUBLIC_ENDPOINT is set (browser -> MinIO presigned requests).
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3000}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://crypticstorage:${POSTGRES_PASSWORD}@postgres:5432/crypticstorage
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      SERVER_ENCRYPTION_KEY: ${SERVER_ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-crypticstorage}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:-10737418240}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-5368709120}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
