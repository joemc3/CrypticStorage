<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create a handoff rule</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 2700px; min-height: 2100px">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="5">
<figure class="slot {{f.cls}}">
<figcaption class="slot-cap">{{f.label}}</figcaption>
<div class="frame {{f.cls}}">

<sc-if value="{{f.form}}" hint-placeholder-val="{{ true }}">
<div class="app" aria-hidden="true">
<aside class="side">
<span class="brand"><svg class="logo" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</span>
<nav class="nav"><sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><span class="nav-a {{n.cls}}"><svg class="i" viewBox="0 0 24 24"><path d="{{n.d}}"></path></svg>{{n.label}}</span></sc-for></nav>
</aside>
<header class="top"><span class="brand"><svg class="logo" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</span></header>
<main class="main"><div class="main-in"><h1 class="d-title">Files</h1>
<div class="list"><sc-for list="{{bg}}" as="r" hint-placeholder-count="4"><div class="li"><div class="li-ic folder"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div><div class="li-main"><span class="li-title">{{r}}</span></div></div></sc-for></div>
</div></main>
</div>
<div class="overlay">
<div class="sheet" role="dialog" aria-label="Handoff rule for Estate">
<div class="grab" aria-hidden="true"></div>
<div class="sheet-head"><div class="stack g4"><span class="d-sec">Handoff rule</span><span class="t-xs c3">Estate · folder · 7 items</span></div><button class="ib" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="sheet-body">
<div class="stack g8">
<span class="label">Who receives it</span>
<ul class="stack g8">
<li class="row between g8" style="padding: 8px 4px 8px 12px; border: 1px solid var(--line); border-radius: 8px"><div class="stack"><span class="t-sm strong wrap-any">daniel.hale@gmail.com</span><span class="ok t-xs">Has an account · key 7F3A 91C2 …</span></div><button class="ib" type="button" aria-label="Remove daniel.hale@gmail.com" style="width: 36px; height: 36px"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></li>
<li class="row between g8" style="padding: 8px 4px 8px 12px; border: 1px solid var(--line); border-radius: 8px"><div class="stack"><span class="t-sm strong wrap-any">sam.hale@proton.me</span><span class="ok t-xs">Has an account · key 3C61 E0F7 …</span></div><button class="ib" type="button" aria-label="Remove sam.hale@proton.me" style="width: 36px; height: 36px"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></li>
</ul>
<div class="row g8"><label class="sr" for="ra-{{f.id}}">Add a recipient</label><input class="input" id="ra-{{f.id}}" type="email" placeholder="Add another by email"><button class="btn btn-secondary" type="button">Add</button></div>
<span class="help">They are told a rule exists for them, not what it covers.</span>
</div>
<fieldset class="field" style="border: 0; padding: 0; margin: 0"><legend class="label" style="margin-bottom: 8px">Release if I have not signed in for</legend>
<div class="choice"><button class="chip" type="button">30 days</button><button class="chip" type="button">90 days</button><button class="chip is-on" type="button" aria-pressed="true">1 year</button><button class="chip" type="button">5 years</button><button class="chip" type="button">10 years</button><button class="chip" type="button">Custom</button></div>
</fieldset>
<div class="callout plain"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>Or sooner, if any 2 of your 3 witnesses agree. You will get reminders at 9 months, 11 months and a final warning.</span></div>
</div>
<div class="sheet-foot"><button class="btn btn-quiet" type="button">Cancel</button><button class="btn btn-primary" type="button">Review</button></div>
</div>
</div>
</sc-if>

<sc-if value="{{f.confirm}}" hint-placeholder-val="{{ false }}">
<div class="pub">
<header class="pub-top"><span class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</span><a class="btn btn-quiet" href="#">Cancel</a></header>
<main class="pub-body"><div class="pub-col">
<div class="fact">
<span class="mono t-xs c3">Handoff rule · Estate · 1 year</span>
<h1 class="d-fact">On 14 Oct 2027, or sooner if your witnesses agree, daniel.hale@gmail.com and sam.hale@proton.me will receive Estate.</h1>
<p class="fact-sub">You will be reminded before then. Signing in resets the clock.</p>
</div>
<div class="fact-foot"><button class="btn btn-primary btn-block" type="button">Create rule</button><button class="btn btn-quiet" type="button">Back</button></div>
</div></main>
</div>
</sc-if>

</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2700,"height":2100}}'>
class Component extends DCLogic {
  renderVals() {
    const NAV = [
      ['Dashboard', 'M4 4h6v9H4zM14 11h6v9h-6zM4 17h6v3H4zM14 4h6v3h-6z', ''],
      ['Files', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'is-on'],
      ['Shared with me', 'M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 13h4l1.5 2.5h5L16 13h4', ''],
      ['Settings', 'M4 7h10M18 7h2M4 17h4M12 17h8M18 7a2 2 0 1 1-4 0a2 2 0 1 1 4 0zM12 17a2 2 0 1 1-4 0a2 2 0 1 1 4 0z', '']
    ];
    const nav = NAV.map(n => ({ label: n[0], d: n[1], cls: n[2] }));
    const bg = ['Crypto', 'Estate', 'Letters', 'Personal'];
    return { nav, bg, frames: [
      { id: 'a', cls: 'desk t-light', label: 'Desktop · the rule', form: true },
      { id: 'b', cls: 'phone t-light', label: 'Phone · the rule', form: true },
      { id: 'c', cls: 'phone t-light', label: 'Phone · one confirmation', confirm: true },
      { id: 'd', cls: 'phone t-dark', label: 'Phone · dark · confirmation', confirm: true },
      { id: 'e', cls: 'desk t-light', label: 'Desktop · one confirmation', confirm: true }
    ] };
  }
}
</script>
</body>
</html>
