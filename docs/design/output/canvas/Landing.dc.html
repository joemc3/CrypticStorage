<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 2260px; min-height: 1300px">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
<figure class="slot {{f.cls}}">
<figcaption class="slot-cap">{{f.label}}</figcaption>
<div class="frame {{f.cls}}">
<div class="pub">
<header class="pub-top">
<a class="brand" href="#"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</a>
<a class="btn btn-quiet" href="#">Sign in</a>
</header>
<main class="pub-body" style="padding-top: 32px">
<div class="land">
<div class="stack g24">
<h1 class="d-hero">A safe, not a drive.</h1>
<p class="t-lead" style="max-width: 34ch">For the few things you cannot afford to lose control of: wallet seeds, recovery codes, legal and financial papers, the password to your password manager. Encrypted in your browser, with keys the server never sees.</p>
<div class="actions" style="margin-top: 8px">
<a class="btn btn-primary" href="#">Create account</a>
<a class="btn btn-secondary" href="#">Sign in</a>
</div>
<p class="t-sm c3" style="max-width: 40ch">Open source and self-hostable. Run it on your own server, or use the hosted service at [HOSTED DOMAIN].</p>
</div>
<div class="stack g16">
<h2 class="cap">Five promises</h2>
<ol class="ledger">
<li><span class="num">01</span><span class="t">The server holds nothing it can read.</span><span class="s">A database dump, a stolen disk or a root shell on the host yields ciphertext.</span></li>
<li><span class="num">02</span><span class="t">Sharing needs no second secret.</span><span class="s">Pick a person with an account. They open it with their own login.</span></li>
<li><span class="num">03</span><span class="t">Links exist, and know their place.</span><span class="s">For people without an account. The key rides in the link, with an optional password, expiry and download limit.</span></li>
<li><span class="num">04</span><span class="t">Anything can be handed on.</span><span class="s">Name who receives an item and what releases it: a timer you reset by showing up, or witnesses who agree it is time.</span></li>
<li><span class="num">05</span><span class="t">There is no recovery.</span><span class="s">Forget the password and the contents are gone. A handoff rule is the only way anyone else reads an item, and only on your terms.</span></li>
</ol>
<div class="row g16 t-sm" style="flex-wrap: wrap; padding-top: 8px"><a href="#">Read the security design</a><a href="#">Source code</a><a href="#">Run it yourself</a></div>
</div>
</div>
</main>
</div>
</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2260,"height":1300}}'>

  renderVals() {
    return { frames: [
      { cls: 'desk t-light', label: 'Desktop · 1280 · light' },
      { cls: 'phone t-light', label: 'Phone · 390 · light' },
      { cls: 'phone t-dark', label: 'Phone · 390 · dark' }
    ] };
  }
}
</script>
</body>
</html>
