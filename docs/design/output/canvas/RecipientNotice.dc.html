<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipient notice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 2260px; min-height: 1050px">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
<figure class="slot {{f.cls}}">
<figcaption class="slot-cap">{{f.label}}</figcaption>
<div class="frame {{f.cls}}">
<div class="pub">
<header class="pub-top"><span class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</span></header>
<main class="pub-body"><div class="pub-col">
<div class="fact">
<div style="width: 52px; height: 52px; border-radius: 26px; border: 1.5px solid var(--line-strong); display: flex; align-items: center; justify-content: center; color: var(--accent-text)"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3v3l5 6-5 6v3M17 3v3l-5 6 5 6v3"></path></svg></div>
<h1 class="d-fact">tom.becker@icloud.com has set something aside for you.</h1>
<p class="fact-sub">You will receive it on their terms. There is nothing to do now.</p>
<p class="t-sm c3">If you do not know this person, you can ignore this.</p>
</div>
<div class="fact-foot"><a class="btn btn-primary btn-block" href="#">Done</a></div>
</div></main>
</div>
</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2260,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [
      { cls: 'desk t-light', label: 'Desktop · 1280 · light' },
      { cls: 'phone t-light', label: 'Phone · 390 · light' },
      { cls: 'phone t-dark', label: 'Phone · 390 · dark' }
    ] };
  }
}
</script>
</body>
</html>
