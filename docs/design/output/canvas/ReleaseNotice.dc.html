<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Release notice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 2260px; min-height: 1150px">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
<figure class="slot {{f.cls}}">
<figcaption class="slot-cap">{{f.label}}</figcaption>
<div class="frame {{f.cls}}">
<div class="app">
<aside class="side">
<a class="brand" href="#"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</a>
<nav class="nav" aria-label="Main"><sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a class="nav-a {{n.cls}}" href="#" aria-current="{{n.cur}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}</a></sc-for></nav>
<div class="side-foot">
<div class="lockline"><span class="dot" aria-hidden="true"></span>Unlocked · locks after 5 min idle</div>
<button class="btn btn-secondary btn-sm btn-block" type="button"><svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Lock now</button>
<span class="t-xs c3">m.hale@fastmail.com</span>
</div>
</aside>
<header class="top">
<a class="brand" href="#"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</a>
<button class="ib" type="button" aria-label="Lock now"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></button>
</header>
<main class="main"><div class="main-in" style="max-width: 760px">
<h1 class="d-title">Your safe</h1>
<section class="card stack g16" role="status">
<div class="row g12" style="align-items: flex-start">
<div class="li-ic {{f.ic}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3v3l5 6-5 6v3M17 3v3l-5 6 5 6v3"></path></svg></div>
<div class="stack g4"><h2 class="d-sec">{{f.head}}</h2><p class="t-sm c2">{{f.sub}}</p></div>
</div>
<ol class="stack" style="border-top: 1px solid var(--line)">
<sc-for list="{{f.lines}}" as="l" hint-placeholder-count="3">
<li style="display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line)"><span class="dot" style="margin-top: 6px; background: {{l.dot}}" aria-hidden="true"></span><div class="stack g4"><span class="t-sm wrap-any">{{l.what}}</span><span class="t-xs c3">{{l.when}}</span></div></li>
</sc-for>
</ol>
<a class="t-sm" href="#">{{f.link}}</a>
</section>
</div></main>
<nav class="tabs" aria-label="Main"><sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a class="tab {{n.cls}}" href="#" aria-current="{{n.cur}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.short}}</a></sc-for></nav>
</div>
</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2260,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 'dash';
    const NAV = [
      ['dash', 'Dashboard', 'Home', 'M4 4h6v9H4zM14 11h6v9h-6zM4 17h6v3H4zM14 4h6v3h-6z'],
      ['files', 'Files', 'Files', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],
      ['shared', 'Shared with me', 'Shared', 'M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 13h4l1.5 2.5h5L16 13h4'],
      ['settings', 'Settings', 'Settings', 'M4 7h10M18 7h2M4 17h4M12 17h8M18 7a2 2 0 1 1-4 0a2 2 0 1 1 4 0zM12 17a2 2 0 1 1-4 0a2 2 0 1 1 4 0z']
    ];
    const nav = NAV.map(n => ({ label: n[1], short: n[2], d: n[3], cls: n[0] === active ? 'is-on' : '', cur: n[0] === active ? 'page' : 'false' }));
    const W = 'var(--warn-text)', G = 'var(--accent)', B = 'var(--info-text)';
    const cancelled = {
      ic: '', head: 'Your sign-in cancelled a release request.', sub: 'Your witnesses have been told. Nothing was released.', link: 'See your witnesses',
      lines: [
        { what: 'priya.n@outlook.com opened a release request', when: '13 Oct, 14:02', dot: W },
        { what: 'tom.becker@icloud.com added a vote · 1 of 2', when: '13 Oct, 16:40', dot: W },
        { what: 'Cancelled by your sign-in', when: 'Today, 09:12', dot: G }
      ]
    };
    const released = {
      ic: 'folder', head: 'Estate was released by your witnesses.', sub: 'It went to daniel.hale@gmail.com and sam.hale@proton.me. Your own copy is unchanged.', link: 'See the rule',
      lines: [
        { what: 'priya.n@outlook.com opened a release request', when: '12 Oct, 10:31', dot: W },
        { what: 'tom.becker@icloud.com added a vote · 1 of 2', when: '13 Oct, 08:05', dot: W },
        { what: 'priya.n@outlook.com added a vote · 2 of 2', when: '14 Oct, 08:15', dot: W },
        { what: 'Released to daniel.hale@gmail.com and sam.hale@proton.me', when: '14 Oct, 08:15', dot: B }
      ]
    };
    return { nav, frames: [
      Object.assign({ cls: 'desk t-light', label: 'Desktop · request cancelled by sign-in' }, cancelled),
      Object.assign({ cls: 'phone t-light', label: 'Phone · request cancelled by sign-in' }, cancelled),
      Object.assign({ cls: 'phone t-dark', label: 'Phone · dark · released by quorum' }, released)
    ] };
  }
}
</script>
</body>
</html>
