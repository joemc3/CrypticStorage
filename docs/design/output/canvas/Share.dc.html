<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 2700px; min-height: 1150px">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="4">
<figure class="slot {{f.cls}}">
<figcaption class="slot-cap">{{f.label}}</figcaption>
<div class="frame {{f.cls}}">
<div class="app" aria-hidden="true">
<aside class="side">
<span class="brand"><svg class="logo" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</span>
<nav class="nav"><sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><span class="nav-a {{n.cls}}"><svg class="i" viewBox="0 0 24 24"><path d="{{n.d}}"></path></svg>{{n.label}}</span></sc-for></nav>
</aside>
<header class="top"><span class="brand"><svg class="logo" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</span></header>
<main class="main"><div class="main-in"><h1 class="d-title">Estate</h1>
<div class="list"><sc-for list="{{bg}}" as="r" hint-placeholder-count="4"><div class="li"><div class="li-ic"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5"></path></svg></div><div class="li-main"><span class="li-title">{{r}}</span></div></div></sc-for></div>
</div></main>
</div>

<div class="overlay">
<div class="sheet" role="dialog" aria-label="Share House deed scan.jpg">
<div class="grab" aria-hidden="true"></div>
<div class="sheet-head"><div class="stack g4" style="min-width: 0"><span class="d-sec">Share</span><span class="t-xs c3 li-title">House deed scan.jpg · 3.1 MB</span></div><button class="ib" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="sheet-body">
<div class="seg" role="tablist" aria-label="Share with"><button type="button" role="tab" class="{{f.tp}}" aria-selected="{{f.person}}">With a person</button><button type="button" role="tab" class="{{f.tl}}" aria-selected="{{f.linkTab}}">With a link</button></div>

<sc-if value="{{f.person}}" hint-placeholder-val="{{ true }}">
<div class="stack g20">
<div class="field"><label class="label" for="se-{{f.id}}">Their account email</label><input class="input" id="se-{{f.id}}" type="email" value="sam.hale@proton.me"></div>
<div class="card stack g12" style="background: var(--surface-2); padding: 16px">
<div class="row between g8"><span class="t-sm strong wrap-any">sam.hale@proton.me</span><span class="badge b-pending">Not verified</span></div>
<div class="fp" aria-label="Key fingerprint 3C61 E0F7 9A24 B1D8 7F3A 91C2 0B4E D58A"><span>3C61</span><span>E0F7</span><span>9A24</span><span>B1D8</span><span>7F3A</span><span>91C2</span><span>0B4E</span><span>D58A</span></div>
<p class="t-sm c2">Compare this with the fingerprint in their Settings, in person or on a call.</p>
<label class="toggle t-sm"><button class="sw" type="button" role="switch" aria-checked="false" aria-label="Mark as verified in person"></button>I have checked it with them</label>
</div>
<div class="stack g8"><span class="t-sm c2">Already shared with</span><div class="row between g8"><span class="t-sm wrap-any">daniel.hale@gmail.com</span><div class="row g8"><span class="badge b-active">Verified</span><button class="btn btn-quiet btn-sm" type="button">Remove</button></div></div></div>
</div>
</sc-if>

<sc-if value="{{f.linkForm}}" hint-placeholder-val="{{ false }}">
<div class="stack g20">
<div class="field"><label class="label" for="lp-{{f.id}}">Password <span class="c3" style="font-weight: 400">· optional</span></label><input class="input" id="lp-{{f.id}}" type="text" value="harbour-9"><span class="help">Send it separately from the link.</span></div>
<fieldset class="field" style="border: 0; padding: 0; margin: 0"><legend class="label" style="margin-bottom: 6px">Expires after</legend><div class="choice"><button class="chip" type="button">1 hour</button><button class="chip" type="button">1 day</button><button class="chip is-on" type="button" aria-pressed="true">7 days</button><button class="chip" type="button">14 days</button><button class="chip" type="button">30 days</button><button class="chip" type="button">Pick a date</button></div></fieldset>
<div class="row between g16"><div class="stack g4"><span class="label">Download limit</span><span class="help">The link stops working after this many.</span></div><div class="stepper"><button type="button" aria-label="Fewer">−</button><output>3</output><button type="button" aria-label="More">+</button></div></div>
</div>
</sc-if>

<sc-if value="{{f.linkMade}}" hint-placeholder-val="{{ false }}">
<div class="stack g16">
<div class="field"><label class="label" for="lu-{{f.id}}">Link</label><div class="input-wrap"><input class="input mono" id="lu-{{f.id}}" readonly value="https://safe.halefamily.org/s/q7Hk2mVb#k=Xw3…"><button class="ib" type="button" aria-label="Copy link"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button></div></div>
<div class="callout warn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg><span>Anyone with this URL can open the file until it expires. Send it only where you would send the file itself.</span></div>
<div class="stack g8 t-sm c2"><div class="row between"><span>Password</span><span>Yes</span></div><div class="row between"><span>Expires</span><span>21 Oct 2026</span></div><div class="row between"><span>Downloads</span><span>0 of 3</span></div></div>
<button class="btn btn-quiet-danger" type="button" style="align-self: flex-start; padding: 0">Revoke this link</button>
</div>
</sc-if>
</div>
<div class="sheet-foot">
<button class="btn btn-quiet" type="button">{{f.cancel}}</button>
<button class="btn btn-primary" type="button">{{f.cta}}</button>
</div>
</div>
</div>
</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2700,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const NAV = [
      ['Dashboard', 'M4 4h6v9H4zM14 11h6v9h-6zM4 17h6v3H4zM14 4h6v3h-6z', ''],
      ['Files', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', 'is-on'],
      ['Shared with me', 'M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 13h4l1.5 2.5h5L16 13h4', ''],
      ['Settings', 'M4 7h10M18 7h2M4 17h4M12 17h8M18 7a2 2 0 1 1-4 0a2 2 0 1 1 4 0zM12 17a2 2 0 1 1-4 0a2 2 0 1 1 4 0z', '']
    ];
    const nav = NAV.map(n => ({ label: n[0], d: n[1], cls: n[2] }));
    const bg = ['Will and testament (signed).pdf', 'House deed scan.jpg', 'Bank accounts.txt', 'Letter to Daniel.txt'];
    const person = { person: true, linkTab: false, tp: 'is-on', tl: '', cancel: 'Cancel', cta: 'Share' };
    const link = { person: false, linkTab: true, tp: '', tl: 'is-on' };
    return { nav, bg, frames: [
      Object.assign({ id: 'a', cls: 'desk t-light', label: 'Desktop · with a person' }, person),
      Object.assign({ id: 'b', cls: 'phone t-light', label: 'Phone · with a person' }, person),
      Object.assign({ id: 'c', cls: 'phone t-light', label: 'Phone · link created', linkMade: true, cancel: 'Close', cta: 'Copy link' }, link),
      Object.assign({ id: 'd', cls: 'phone t-dark', label: 'Phone · dark · new link', linkForm: true, cancel: 'Cancel', cta: 'Create link' }, link)
    ] };
  }
}
</script>
</body>
</html>
