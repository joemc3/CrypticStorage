<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Witness invitation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 2260px; min-height: 1050px">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
<figure class="slot {{f.cls}}">
<figcaption class="slot-cap">{{f.label}}</figcaption>
<div class="frame {{f.cls}}">
<div class="pub">
<header class="pub-top"><span class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="10.5" r="2.2"></circle><path d="M12 12.7v3.8"></path></svg>CrypticStorage</span><a class="btn btn-quiet" href="#">Decide later</a></header>
<main class="pub-body"><div class="pub-col">

<sc-if value="{{f.ask}}" hint-placeholder-val="{{ true }}">
<div class="fact">
<span class="mono t-xs c3">Witness invitation · 13 Oct 2026</span>
<h1 class="d-fact">r.okafor@gmail.com is asking you to be a witness.</h1>
<p class="fact-sub">Together with others they name, you could release their items to the people they chose. You will never be able to read those items yourself unless you are also a recipient.</p>
</div>
<div class="fact-foot"><button class="btn btn-primary btn-block" type="button">Accept the duty</button><button class="btn btn-quiet" type="button">Decline</button></div>
</sc-if>

<sc-if value="{{f.done}}" hint-placeholder-val="{{ false }}">
<div class="stack g20" style="padding-top: 48px">
<div class="li-ic folder" style="width: 52px; height: 52px; border-radius: 26px"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
<h1 class="d-title">You are a witness for r.okafor@gmail.com.</h1>
<p class="c2">Nothing is needed from you now. If the time comes, you can request a release from your dashboard.</p>
</div>
<div class="fact-foot"><a class="btn btn-primary btn-block" href="#">Go to dashboard</a></div>
</sc-if>

</div></main>
</div>
</div>
</figure>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2260,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [
      { cls: 'desk t-light', label: 'Desktop · invitation', ask: true },
      { cls: 'phone t-light', label: 'Phone · invitation', ask: true },
      { cls: 'phone t-dark', label: 'Phone · dark · accepted', done: true }
    ] };
  }
}
</script>
</body>
</html>
